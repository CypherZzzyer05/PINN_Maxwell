[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-maxwell"
version = "0.2.0"
description = "Interface-aware Maxwell PINNs for slab guides and full-vector dielectric fibers"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.21", "scipy>=1.7", "matplotlib>=3.5"]

[project.scripts]
pinn-maxwell = "pinn_maxwell.demo:main"
pinn-maxwell-fiber = "pinn_maxwell.fiber_demo:main"

[tool.setuptools.packages.find]
include = ["pinn_maxwell*", "fdtd_validation*"]
